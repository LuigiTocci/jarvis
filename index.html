<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04101c">
<title>Jarvis</title>
<style>
:root{--bg:#04101c;--cy:#4fd8ff;--ice:#d8f6ff;--dim:#6f9bb0;--am:#ffb347;--line:#12384f;--glow:79,216,255}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 38%,#0a2a40 0,var(--bg) 62%);color:var(--ice);font:16px/1.45 -apple-system,"SF Pro Text",system-ui,sans-serif;display:grid;grid-template-rows:auto 1fr auto auto;gap:8px;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow:hidden;-webkit-user-select:none;user-select:none}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#clock{font-size:clamp(40px,8vw,72px);font-weight:200;letter-spacing:.04em;font-variant-numeric:tabular-nums;line-height:1}
#date{color:var(--dim);font-size:14px;margin-top:4px;text-transform:capitalize}
.hr{text-align:right}
#st{color:var(--cy);font-size:14px;letter-spacing:.12em}
.hr button{margin-top:8px}
button{font:inherit;color:var(--ice);background:rgba(var(--glow),.08);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
main{display:grid;place-items:center;min-height:0}
#orb{width:min(56vmin,400px);aspect-ratio:1;background:none;border:0;padding:0;border-radius:50%;-webkit-tap-highlight-color:transparent}
#orb svg{width:100%;height:100%;overflow:visible}
.r{transform-origin:100px 100px;fill:none;stroke:var(--cy)}
.r1{stroke-width:1.2;stroke-dasharray:4 7;animation:spin 40s linear infinite}
.r2{stroke-width:3;stroke-dasharray:60 20 12 20;opacity:.8;animation:spin 18s linear infinite reverse}
.r3{stroke-width:1;opacity:.5;stroke-dasharray:2 3;animation:spin 60s linear infinite}
.core{fill:rgba(var(--glow),.18);stroke:var(--cy);stroke-width:2;transform-origin:100px 100px;filter:drop-shadow(0 0 10px rgb(var(--glow)))}
.tri{fill:none;stroke:var(--ice);stroke-width:1.5;opacity:.85;transform-origin:100px 100px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.14)}}
@keyframes beat{50%{transform:scale(.92);opacity:.6}}
[data-state=listening]{--glow:255,179,71}
[data-state=listening] .r,[data-state=listening] .core{stroke:var(--am)}
[data-state=listening] .core{animation:pulse 1.4s ease-in-out infinite}
[data-state=thinking] .r1{animation-duration:4s}[data-state=thinking] .r2{animation-duration:2.5s}
[data-state=speaking] .core{animation:pulse .5s ease-in-out infinite}
[data-state=idle] .core{animation:beat 4s ease-in-out infinite}
#log{display:grid;gap:6px;max-height:26vh;overflow:auto;font-size:15px;-webkit-user-select:text;user-select:text}
#log div{padding:6px 12px;border-left:2px solid var(--line);max-width:70ch}
#log .u{color:var(--dim)}#log .j{border-color:var(--cy)}
#chips{display:flex;gap:8px;flex-wrap:wrap;min-height:34px}
.chip{font-variant-numeric:tabular-nums;border:1px solid var(--cy);border-radius:999px;padding:4px 12px;font-size:14px}
form{display:flex;gap:8px}
input[type=text],input[type=password]{flex:1;font:inherit;color:var(--ice);background:rgba(var(--glow),.06);border:1px solid var(--line);border-radius:12px;padding:12px 14px;-webkit-user-select:text;user-select:text;min-width:0}
dialog{background:#071c2c;color:var(--ice);border:1px solid var(--cy);border-radius:16px;padding:20px;width:min(520px,92vw);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog label{display:grid;gap:4px;margin:12px 0;font-size:14px;color:var(--dim)}
dialog label.c{display:flex;gap:10px;align-items:center}
dialog h2{font-weight:400;font-size:20px}
dialog p{font-size:13px;color:var(--dim);margin-top:8px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#nl{display:grid;gap:8px;margin-top:12px;max-height:50vh;overflow:auto}
#nl div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body data-state="idle">
<header>
  <div><div id="clock">--:--</div><div id="date"></div></div>
  <div class="hr"><div id="st">Pronto</div><button id="nb" type="button">Note</button> <button id="sb" type="button">Impostazioni</button></div>
</header>
<main>
  <button id="orb" type="button" aria-label="Parla con Jarvis">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle class="r r3" cx="100" cy="100" r="96"/>
      <circle class="r r1" cx="100" cy="100" r="84"/>
      <circle class="r r2" cx="100" cy="100" r="68"/>
      <circle class="core" cx="100" cy="100" r="34"/>
      <polygon class="tri" points="100,78 119,111 81,111"/>
    </svg>
  </button>
</main>
<section>
  <div id="log" aria-live="polite"></div>
  <div id="chips"></div>
</section>
<form id="f" autocomplete="off">
  <input id="q" type="text" placeholder="Scrivi o tocca il cerchio per parlare" enterkeyhint="send" aria-label="Messaggio per Jarvis">
  <button type="submit">Invia</button>
</form>

<dialog id="sd">
  <h2>Impostazioni</h2>
  <label>Chiave Google Gemini (gratuita, aistudio.google.com)<input id="gk" type="password" autocomplete="off"></label>
  <label>Chiave Groq (gratuita, console.groq.com)<input id="qk" type="password" autocomplete="off"></label>
  <label>Modello Gemini<input id="gm" type="text"></label>
  <label>Modello Groq<input id="qm" type="text"></label>
  <label class="c"><input id="vo" type="checkbox">Risposte a voce</label>
  <label class="c"><input id="wk" type="checkbox">Ascolto continuo: rispondo quando dici “Jarvis”</label>
  <p>Le chiavi restano solo su questo dispositivo. Se un servizio raggiunge il limite gratuito, passo automaticamente all’altro.</p>
  <div class="row"><button id="sx" type="button">Annulla</button><button id="ss" type="button">Salva</button></div>
</dialog>
<dialog id="nd">
  <h2>Note</h2>
  <div id="nl"></div>
  <div class="row"><button id="nx" type="button">Chiudi</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let cfg=Object.assign({gk:"",qk:"",gm:"gemini-2.5-flash",qm:"llama-3.3-70b-versatile",voice:true,wake:false},store.get("jv_cfg",{}));
let notes=store.get("jv_notes",[]),timers=[],hist=[],busy=false,rec=null,lock=null;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const STATES={idle:"Pronto",listening:"Ti ascolto",thinking:"Elaboro",speaking:"Parlo"};

function setState(s){document.body.dataset.state=s;$("#st").textContent=STATES[s]}
function log(role,text){const d=document.createElement("div");d.className=role;d.textContent=text;const l=$("#log");l.append(d);while(l.children.length>6)l.firstChild.remove();l.scrollTop=l.scrollHeight}
function clock(){const n=new Date();$("#clock").textContent=n.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});$("#date").textContent=n.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"})}

/* Voce in uscita */
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>x.lang.startsWith("it"));return v.find(x=>/enhanced|premium|luca|alice/i.test(x.name))||v[0]}
function say(text){
  log("j",text);
  return new Promise(res=>{
    if(!cfg.voice||!window.speechSynthesis)return res();
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang="it-IT";u.rate=1.05;
    const v=pickVoice();if(v)u.voice=v;
    const t=setTimeout(res,Math.min(60000,text.length*130+3000));
    u.onstart=()=>setState("speaking");
    u.onend=u.onerror=()=>{clearTimeout(t);res()};
    speechSynthesis.speak(u);
  });
}

/* Voce in ingresso */
function listen(){
  if(!SR){log("j","Il riconoscimento vocale non è disponibile su questo browser: usa la tastiera.");return}
  if(busy)return;stopListen();
  rec=new SR();rec.lang="it-IT";rec.interimResults=false;rec.continuous=false;
  rec.onstart=()=>setState("listening");
  rec.onresult=e=>{const t=e.results[0][0].transcript;if(cfg.wake&&!/jarvis/i.test(t))return;handle(t)};
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){cfg.wake=false;stopListen();setState("idle");log("j","Microfono bloccato. Consenti l’accesso al microfono in Safari e riprova.")}};
  rec.onend=()=>{if(!busy){setState("idle");if(cfg.wake)setTimeout(listen,400)}};
  try{rec.start()}catch{}
}
function stopListen(){if(rec){rec.onend=null;try{rec.abort()}catch{}rec=null}}

/* Timer e suoni */
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.3,.6].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+.18)})}catch{}}
function addTimer(sec,label){timers.push({end:Date.now()+sec*1000,label});renderChips()}
function fmt(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s%60).padStart(2,"0")}
function renderChips(){$("#chips").replaceChildren(...timers.map(t=>{const c=document.createElement("span");c.className="chip";c.textContent=t.label+" "+fmt((t.end-Date.now())/1000);return c}))}
setInterval(()=>{
  clock();
  const done=timers.filter(t=>t.end<=Date.now());
  if(done.length){timers=timers.filter(t=>t.end>Date.now());beep();if(!busy)say("Il "+done[0].label.toLowerCase()+" è terminato.")}
  renderChips();
},1000);

/* Note */
function saveNotes(){store.set("jv_notes",notes)}
function renderNotes(){
  const l=$("#nl");l.replaceChildren();
  if(!notes.length){l.textContent="Nessuna nota. Dì: “Jarvis, prendi nota di chiamare il fornitore”.";return}
  notes.forEach((n,i)=>{const d=document.createElement("div"),s=document.createElement("span"),b=document.createElement("button");s.textContent=n;b.textContent="Elimina";b.type="button";b.onclick=()=>{notes.splice(i,1);saveNotes();renderNotes()};d.append(s,b);l.append(d)});
}

/* Meteo (Open-Meteo, gratuito e senza chiave) */
const WX={0:"sereno",1:"quasi sereno",2:"parzialmente nuvoloso",3:"coperto",45:"nebbia",48:"nebbia",51:"pioviggine",53:"pioviggine",55:"pioviggine",61:"pioggia debole",63:"pioggia",65:"pioggia forte",71:"neve",73:"neve",75:"neve forte",80:"rovesci",81:"rovesci",82:"rovesci forti",95:"temporale",96:"temporale",99:"temporale"};
function pos(){return new Promise(r=>{if(!navigator.geolocation)return r([41.9,12.5]);navigator.geolocation.getCurrentPosition(p=>r([p.coords.latitude,p.coords.longitude]),()=>r([41.9,12.5]),{timeout:6000})})}
async function meteo(){
  const [la,lo]=await pos();
  const j=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`,{signal:AbortSignal.timeout(10000)})).json();
  const c=j.current,d=j.daily;
  return `Ora ci sono ${Math.round(c.temperature_2m)} gradi, ${WX[c.weather_code]||"tempo variabile"}. Oggi tra ${Math.round(d.temperature_2m_min[0])} e ${Math.round(d.temperature_2m_max[0])} gradi, probabilità di pioggia ${d.precipitation_probability_max[0]||0} per cento.`;
}

/* Comandi locali: nessuna chiamata all’AI, quindi nessun limite */
const SITES={youtube:"https://youtube.com",maps:"https://maps.apple.com",mappe:"https://maps.apple.com",gmail:"https://mail.google.com",calendario:"https://calendar.google.com",linkedin:"https://linkedin.com"};
async function local(c,l){
  if(!l)return "Dimmi, sono qui.";
  let m;
  if(/che ore sono|che ora è|che ora e|l’ora|l'ora/.test(l))return "Sono le "+new Date().toLocaleTimeString("it-IT",{hour:"numeric",minute:"2-digit"})+".";
  if(/che giorno|quanti ne abbiamo|che data/.test(l))return "Oggi è "+new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+".";
  if(m=l.match(/(?:timer|svegliami|avvisami)\D{0,15}?(\d+)\s*(second|minut|or)/)){
    const k={s:1,m:60,o:3600}[m[2][0]],n=+m[1];addTimer(n*k,"Timer "+m[1]+" "+m[2][0].replace("s","sec").replace("m","min").replace("o","h"));return `Timer impostato: ${n} ${m[2]==="or"?"ore":m[2]==="minut"?"minuti":"secondi"}.`}
  if(/(annulla|cancella|ferma)\s.*timer/.test(l)){timers=[];renderChips();return "Timer annullati."}
  if(m=c.match(/^(?:prendi (?:una )?nota|annota|nota|ricordami(?: di)?|ricorda(?: che)?)[:,\s]+(?:di |che )?(.+)/i)){notes.push(m[1]);saveNotes();return "Nota salvata."}
  if(/(cancella|svuota|elimina)\s.*note/.test(l)){notes=[];saveNotes();return "Note cancellate."}
  if(/(mostra|leggi|elenca|dimmi)\s.*note/.test(l))return notes.length?"Hai "+notes.length+" note. "+notes.map((n,i)=>(i+1)+": "+n).join(". "):"Non hai note salvate.";
  if(/\bmeteo\b|che tempo fa|previsioni/.test(l))return await meteo();
  if(m=c.match(/^(?:esegui|lancia)\s+(?:il\s+)?(?:comando|scorciatoia)\s+(.+)/i)){location.href="shortcuts://run-shortcut?name="+encodeURIComponent(m[1]);return "Eseguo "+m[1]+"."}
  if(m=l.match(/^apri\s+(.+)/)){const k=m[1].trim(),u=SITES[k]||"https://www.google.com/search?q="+encodeURIComponent(k);window.open(u,"_blank");return "Apro "+k+"."}
  if(/^(grazie|ottimo|perfetto)\b/.test(l))return "Sempre a disposizione.";
  return null;
}

/* Cervello AI con ripiego automatico tra provider gratuiti */
const SYS=()=>"Sei Jarvis, assistente personale in italiano: cortese, preciso, con un tocco di ironia sobria. Rispondi in massimo tre frasi brevi, adatte alla lettura vocale, senza markdown, elenchi o emoji. Oggi è "+new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+".";
async function viaGemini(){
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg.gm)}:generateContent?key=${encodeURIComponent(cfg.gk)}`,{method:"POST",headers:{"Content-Type":"application/json"},signal:AbortSignal.timeout(20000),body:JSON.stringify({systemInstruction:{parts:[{text:SYS()}]},contents:hist.map(h=>({role:h.role==="user"?"user":"model",parts:[{text:h.text}]}))})});
  if(!r.ok)throw new Error("Gemini "+r.status);
  const j=await r.json();return j.candidates[0].content.parts.map(p=>p.text||"").join("");
}
async function viaGroq(){
  const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+cfg.qk},signal:AbortSignal.timeout(20000),body:JSON.stringify({model:cfg.qm,messages:[{role:"system",content:SYS()},...hist.map(h=>({role:h.role,content:h.text}))]})});
  if(!r.ok)throw new Error("Groq "+r.status);
  const j=await r.json();return j.choices[0].message.content;
}
async function ai(text){
  const provs=[];if(cfg.gk)provs.push(viaGemini);if(cfg.qk)provs.push(viaGroq);
  if(!provs.length)return "Per le domande aperte mi serve una chiave gratuita. Apri le impostazioni e inseriscila.";
  hist.push({role:"user",text});hist=hist.slice(-12);
  let err="";
  for(const p of provs){try{const out=(await p()).replace(/[*_`#]/g,"").trim();if(out){hist.push({role:"assistant",text:out});return out}}catch(e){err=e.message}}
  hist.pop();return "I servizi gratuiti non rispondono al momento ("+err+"). Riprova tra poco.";
}

/* Flusso principale */
async function handle(raw){
  const t=raw.trim();if(!t||busy)return;
  busy=true;stopListen();log("u",t);setState("thinking");
  const c=t.replace(/^(?:ehi|ehy|ciao|ok|hey|senti)?[\s,]*jarvis[\s,:.!?]*/i,"").trim();
  let reply;
  try{reply=(await local(c,c.toLowerCase()))??(await ai(c))}catch(e){reply="Non riesco a completare la richiesta: "+e.message}
  await say(reply);
  busy=false;setState("idle");if(cfg.wake)listen();
}

/* Interfaccia */
$("#orb").onclick=()=>{
  if(speechSynthesis.speaking){speechSynthesis.cancel();return}
  if(rec&&!cfg.wake){stopListen();setState("idle");return}
  listen();
};
$("#f").onsubmit=e=>{e.preventDefault();const q=$("#q");const v=q.value;q.value="";handle(v)};
$("#sb").onclick=()=>{$("#gk").value=cfg.gk;$("#qk").value=cfg.qk;$("#gm").value=cfg.gm;$("#qm").value=cfg.qm;$("#vo").checked=cfg.voice;$("#wk").checked=cfg.wake;$("#sd").showModal()};
$("#sx").onclick=()=>$("#sd").close();
$("#ss").onclick=()=>{
  Object.assign(cfg,{gk:$("#gk").value.trim(),qk:$("#qk").value.trim(),gm:$("#gm").value.trim()||"gemini-2.5-flash",qm:$("#qm").value.trim()||"llama-3.3-70b-versatile",voice:$("#vo").checked,wake:$("#wk").checked});
  store.set("jv_cfg",cfg);$("#sd").close();
  if(cfg.voice&&window.speechSynthesis)speechSynthesis.speak(new SpeechSynthesisUtterance(""));
  if(cfg.wake){listen();try{navigator.wakeLock?.request("screen").then(l=>lock=l).catch(()=>{})}catch{}}else{stopListen();setState("idle");try{lock?.release()}catch{}}
};
$("#nb").onclick=()=>{renderNotes();$("#nd").showModal()};
$("#nx").onclick=()=>$("#nd").close();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&cfg.wake&&!rec&&!busy)listen()});
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{};
clock();
log("j","Sistemi attivi. Tocca il cerchio e parlami, oppure scrivi qui sotto.");
if(!cfg.gk&&!cfg.qk)log("j","Per le domande aperte inserisci una chiave gratuita nelle impostazioni. Timer, note, meteo e orario funzionano già.");
</script>
</body>
</html>
